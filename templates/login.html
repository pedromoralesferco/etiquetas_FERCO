{% extends "base.html" %}
{% block title %}Iniciar sesión — PrecioValida{% endblock %}
{% block wrap_class %}wrap-narrow{% endblock %}
{% block content %}
<div class="login-box">
  <div class="brand" style="margin-bottom: 24px;">
    <span class="brand-dot"></span> PrecioValida
  </div>
  <div class="page-sub" style="margin-bottom: 24px;">
    Validación de cambios de precio en piso.
  </div>

  <form method="post" class="stack">
    <div class="form-group">
      <label class="form-label" for="email">Correo</label>
      <input class="form-input" type="email" id="email" name="email" required autofocus>
    </div>
    <div class="form-group">
      <label class="form-label" for="password">Contraseña</label>
      <input class="form-input" type="password" id="password" name="password" required>
    </div>
    <button class="btn btn-block" type="submit">Entrar</button>
  </form>

  <div class="muted mono" style="font-size: 11px; margin-top: 20px; letter-spacing: 0.05em;">
    DEMO · admin@demo.gt · gerente.zona10@demo.gt<br>
    Pass: demo1234
  </div>
</div>
{% endblock %}
